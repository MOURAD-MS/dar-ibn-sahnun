<body>

<!-- Toast -->
<div id="toast" class="toast"></div>
<!-- Mobile Menu Toggle -->
<button class="menu-toggle" id="menuToggle" onclick="app.toggleMenu()">☰</button>
<!-- Menu Overlay -->
<div class="menu-overlay" id="menuOverlay" onclick="app.toggleMenu()"></div>
<!-- ============ LOGIN SCREEN ============ -->
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="login-tabs">
      <button class="login-tab active" id="tabUser" onclick="app.switchLoginTab('user')">تسجيل الدخول</button>
      <button class="login-tab" id="tabAdmin" onclick="app.switchLoginTab('admin')">مدير النظام</button>
    </div>
    <div id="userLoginForm">
      <h1>🕌 معهد الإمام سحنون</h1>
      <p>للعلوم الشرعية - تسجيل الدخول</p>
      <input type="text" id="loginUsername" placeholder="اسم المستخدم" autocomplete="username">
      <input type="password" id="loginPassword" placeholder="كلمة المرور" autocomplete="current-password">
      <label class="remember-label">
        <input type="checkbox" id="rememberMe" checked> تذكرني (لا تُخرجني إلا بتسجيل خروج صريح)
      </label>
      <button onclick="app.login()">تسجيل الدخول</button>
      <p style="margin-top:14px; font-size:0.82rem; color:#0d47a1; cursor:pointer; text-decoration:underline;" onclick="app.showForgotUserPassword()">🔐 نسيت كلمة المرور؟</p>
    </div>
    <div id="adminLoginForm" class="hidden">
      <h1>🕌 معهد الإمام سحنون</h1>
      <p>لوحة المدير - تسجيل الدخول</p>
      <input type="email" id="adminEmail" placeholder="البريد الإلكتروني" autocomplete="email" dir="ltr">
      <input type="password" id="adminPassword" placeholder="كلمة المرور" autocomplete="current-password">
      <button onclick="app.adminLogin()">دخول المدير</button>
      <p style="margin-top:14px; font-size:0.82rem; color:#0d47a1; cursor:pointer; text-decoration:underline;" onclick="app.showForgotAdminPassword()">🔐 نسيت كلمة المرور؟</p>
    </div>
  </div>
</div>
<!-- ============ APP CONTAINER ============ -->
<div id="appContainer" class="app-container hidden">
  <div class="sidebar" id="sidebar">
    <h2>🕌 المعهد الشرعي</h2>
    <div id="navMenu"></div>
    <div style="margin-top:24px; padding-top:16px; border-top:1px solid rgba(255,255,255,0.2);">
      <div class="nav-item" onclick="app.logout()">🚪 تسجيل الخروج</div>
    </div>
  </div>
  <div class="main-content" id="mainContent"></div>
</div>
<script src="app.js"></script>
 

<!-- ===== Service Worker Registration ===== -->
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js')
      .then(() => console.log('Service Worker: مسجل ✅'))
      .catch(err => console.log('Service Worker: فشل ❌', err));
  }
</script>
