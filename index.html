<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#1a5f2a">
  <title>معهد الإمام سحنون للعلوم الشرعية</title>
  <link rel="stylesheet" href="style.css?v=3">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <!-- jsPDF for PDF export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <!-- Toast Notification -->
  <div id="toast" class="toast"></div>

  <!-- Login Screen -->
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <div class="logo">
        <div class="logo-icon">🕌</div>
        <h1>معهد الإمام سحنون</h1>
        <p>للعلوم الشرعية</p>
      </div>

      <div class="login-tabs">
        <div id="tabUser" class="login-tab active" onclick="app.switchLoginTab('user')">طالب / أستاذ</div>
        <div id="tabAdmin" class="login-tab" onclick="app.switchLoginTab('admin')">المدير</div>
      </div>

      <div id="userLoginForm" class="login-form">
        <div class="form-group">
          <label>البريد الإلكتروني</label>
          <input type="email" id="loginEmail" placeholder="example@email.com" autocomplete="email" dir="ltr">
        </div>
        <div class="form-group">
          <label>كلمة المرور</label>
          <input type="password" id="loginPassword" placeholder="أدخل كلمة المرور" autocomplete="current-password">
        </div>
        <button class="btn btn-primary btn-block" onclick="app.login()">🔐 تسجيل الدخول</button>
        <p style="text-align:center; margin-top:10px; font-size:0.85rem;"><a href="#" onclick="app.forgotPassword()" style="color:#1a5f2a;">🔑 نسيت كلمة المرور؟</a></p>
      </div>

      <div id="adminLoginForm" class="login-form hidden">
        <div class="form-group">
          <label>البريد الإلكتروني</label>
          <input type="email" id="adminEmail" placeholder="admin@example.com" autocomplete="email" dir="ltr">
        </div>
        <div class="form-group">
          <label>كلمة المرور</label>
          <input type="password" id="adminPassword" placeholder="أدخل كلمة المرور" autocomplete="current-password">
        </div>
        <button class="btn btn-primary btn-block" onclick="app.adminLogin()">🔐 دخول المدير</button>
        <p style="text-align:center; margin-top:10px; font-size:0.85rem;"><a href="#" onclick="app.forgotPassword(true)" style="color:#1a5f2a;">🔑 نسيت كلمة المرور؟</a></p>
      </div>

      <p class="login-footer">نظام معهد الإمام سحنون السحابي — جميع البيانات تُحفظ بأمان في Firebase</p>
    </div>
  </div>

  <!-- App Container -->
  <div id="appContainer" class="app-container hidden">
    <header class="app-header">
      <button class="menu-btn" onclick="app.toggleMenu()" aria-label="القائمة">☰</button>
      <div class="header-title">
        <span class="header-icon">🕌</span>
        <span>معهد الإمام سحنون</span>
      </div>
      <div style="position:relative; display:inline-flex; align-items:center;">
        <button class="logout-btn" onclick="app.navigate('myNotifications')" aria-label="الإشعارات" style="margin-left:8px;">🔔</button>
        <span id="notificationBadge" class="notification-badge">0</span>
      </div>
      <button class="logout-btn" onclick="app.logout()" aria-label="خروج">🚪</button>
    </header>

    <div class="app-body">
      <aside id="sidebar" class="sidebar">
        <div id="navMenu" class="nav-menu"></div>
      </aside>
      <main id="mainContent" class="main-content"></main>
    </div>
  </div>

  <!-- Mobile Menu Overlay -->
  <div id="menuOverlay" class="menu-overlay" onclick="app.toggleMenu()"></div>

  <!-- App Logic -->
  <script src="app.js?v=3"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js?v=4')
        .then(function(reg) { console.log('SW registered:', reg.scope); })
        .catch(function(err) { console.log('SW registration failed:', err); });
    }
  </script>
</body>
</html>
